# PR-Agent settings for this repository. PR-Agent reads this file from the
# default branch (main).
# Options: https://github.com/The-PR-Agent/pr-agent/blob/v0.50.0/pr_agent/settings/configuration.toml

[github_app]
# Review draft pull requests too, and run /describe and /review again on every push.
feedback_on_draft_pr = true
handle_push_trigger = true

[pr_reviewer]
num_max_findings = 5
extra_instructions = """\
Also check these rules:

Secrets:
- A new token or password passes through the secret masker before anything logs it: `setSecrets` in `extensions/azure/src/common.ts`, `secretMasker` in `packages/cli/src/utils/masker.ts`, or the `SecretMasker` passed to `packages/core/src/runner/run.ts`. Flag tokens in URLs, error messages or log lines.
- Registry credentials reach only the proxy, through `buildProxyConfig` in `packages/core/src/runner/proxy.ts`. Flag credentials added to the updater container `Env` in `updater-builder.ts` or to the job file.
- Files under `packages/core/fixtures/` and `bruno/` hold synthetic data only: no real tokens, organisation URLs or email addresses. `bruno/.env.sample` keeps placeholder values.

Runner and images (packages/core/src/runner, packages/core/docker):
- Updater and proxy images change in `packages/core/docker/Dockerfile.*`, pinned by tag and `@sha256` digest. `pnpm scripts:update-container-manifest` rebuilds `containers.json`. A new ecosystem adds a Dockerfile and an entry in `update-containers.ts`.
- Containers and networks are removed on failure paths too (`proxy.ts`, `container-service.ts`, `cleanup.ts`).

Azure DevOps (packages/core/src/azure, extensions/azure):
- REST calls go through the `client-*.ts` classes and `makeUrl` in `client-base.ts`, which adds `api-version`.
- Inputs in `extensions/azure/tasks/**/task.json` are a public contract. Flag renamed, removed or re-defaulted inputs. A new input is read in `src/v2/inputs.ts` and covered in `src/v2/inputs.test.ts`.
- `scripts/update-versions.mjs` sets the versions in `task.json` and `vss-extension.json` during `pnpm packages:version`. Flag hand edits to those version fields.

Changes and tests:
- Behaviour changes in `packages/*` or `extensions/azure/src` add or update a Vitest `*.test.ts` next to the source and a changeset in `.changeset/`.
- A change to `dependabot.yml` parsing in `packages/core/src/dependabot/config.ts` adds a fixture under `packages/core/fixtures/config/` and a case in `config.test.ts`.
- The `dependabot-action`, `dependabot-cli`, `dependabot-fetch-metadata` and `dependabot-proxy` directories are upstream submodules. Flag pointer bumps without a stated reason.
- `pnpm-workspace.yaml` keeps `minimumReleaseAge` and the `allowBuilds` entries set to `false`. Flag new install-script approvals.
"""

[pr_code_suggestions]
# Publish only suggestions scored 5 or higher (0-10).
suggestions_score_threshold = 5
extra_instructions = "Prefer existing project helpers and patterns over new abstractions. Do not suggest edits to packages/core/docker/containers.json, CHANGELOG.md files, lock files or the vendored skills under .agents/."

[ignore]
# Generated code and lock files. Replaces the default list; keep vendor/** first.
glob = [
    "vendor/**",
    "**/pnpm-lock.yaml",
    "skills-lock.json",
    ".devcontainer/devcontainer-lock.json",
    ".agents/**",
    "**/CHANGELOG.md",
    "packages/core/docker/containers.json",
]
